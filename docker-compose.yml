services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desafiomirante_api
    ports:
      - "5291:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Sqlite=Data Source=/data/desafiomirante.db
      - Persistencia__Provedor=Sqlite
      - Logging__LogLevel__Default=Information
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  sqlite_data:
